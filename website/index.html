  <main id="projects" class="mx-auto w-full max-w-shell flex-1 px-5 pb-10 pt-6 sm:px-8 sm:pb-12 sm:pt-7">
    <!-- chips are built from the categories in /projects.json: one row (swipeable),
         and the toggle wraps them onto as many rows as they need -->
    <div class="flex items-start gap-3">
      <div id="filters" role="group" aria-label="Filter by category"
        class="no-scrollbar flex min-w-0 flex-1 gap-2 overflow-x-auto"></div>
      <button id="moreCats" type="button" aria-expanded="false" aria-controls="filters" hidden
        class="inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full px-3 py-2 text-[0.88rem] font-semibold text-brand transition hover:text-brand-deep">

      © <span id="year">2026</span>
      <a href="https://orginfo.uz/en/organization/7762f625029a/" target="_blank" rel="noopener"
        class="underline decoration-white/30 underline-offset-4 transition hover:text-white hover:decoration-brand-lt">ООО "ACCELERAIT"</a>.

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const list = document.getElementById('projectList');
    const filters = document.getElementById('filters');
    const listBox = document.getElementById('listBox');
    const more = document.getElementById('moreCats');
    const moreLabel = document.getElementById('moreCatsLabel');
    const ALL = 'all';
    let projects = [];

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text) n.textContent = text;   // textContent, never innerHTML: the JSON is data
      return n;
    }

    const slug = s => s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    // `category` may be a single string or a list
    const categoriesOf = p => [].concat(p.category || []);

    function initials(name) {
      return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    // no thumbnail, or one that fails to load: a branded panel with the initials
    function emptyCover(cover, name) {
      cover.style.backgroundImage = '';
      cover.removeAttribute('role');
      cover.classList.add('is-empty');
      const mark = el('span', 'font-display text-[2.4rem] font-semibold tracking-tighter2 text-white/90', initials(name));
      mark.setAttribute('aria-hidden', 'true');
      cover.replaceChildren(mark);
    }

    function card(p) {
      const article = el('article', 'group flex h-full flex-col overflow-hidden rounded-2xl border border-hair bg-white transition-colors duration-200 hover:border-brand');

      const cover = el('div', 'project-cover relative aspect-[1200/630] bg-paper bg-contain bg-center bg-no-repeat');
      if (p.thumbnail) {
        cover.style.backgroundImage = `url("${encodeURI(p.thumbnail)}")`;
        cover.setAttribute('role', 'img');
        cover.setAttribute('aria-label', p.name);
        const probe = new Image();
        probe.onerror = () => emptyCover(cover, p.name);
        probe.src = p.thumbnail;
      } else {
        emptyCover(cover, p.name);
      }

      const title = el('h2', 'font-display text-[1.2rem] font-semibold tracking-tighter2');
      if (p.link) {
        const a = el('a', 'underline-offset-4 transition-colors hover:text-brand hover:underline', p.name);
        a.href = p.link; a.target = '_blank'; a.rel = 'noopener';
        title.append(a);
      } else {
        title.textContent = p.name;
      }

      const tags = el('div', 'mt-4 flex flex-wrap items-center gap-1.5');
      categoriesOf(p).forEach(c =>
        tags.append(el('span', 'rounded-full bg-brand-soft px-2.5 py-0.5 font-mono text-[0.68rem] uppercase tracking-[0.08em] text-brand-deep', c)));

      const body = el('div', 'flex flex-1 flex-col p-6');
      body.append(title,
        el('p', 'mt-3 flex-1 text-[0.92rem] leading-[1.55] text-muted', p.description),
        tags);

      article.append(cover, body);
      return article;
    }

    function chip(key, label, count) {
      const b = el('button', 'chip inline-flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full border border-hair bg-white px-4 py-2 text-[0.88rem] font-medium transition hover:border-ink');
      b.type = 'button';
      b.dataset.cat = key;
      b.append(label, el('span', 'chip-count font-mono text-[0.72rem] text-dim', String(count)));
      b.addEventListener('click', () => select(key, true));
      return b;
    }

    function buildFilters() {
      // how many projects each category has; the kind of work (LEAD) first, then fields A–Z
      const LEAD = ['Startups', 'Clients', 'Open-source'];
      const counts = new Map();
      projects.forEach(p => categoriesOf(p).forEach(c => counts.set(c, (counts.get(c) || 0) + 1)));
      const rank = c => (LEAD.includes(c) ? LEAD.indexOf(c) : LEAD.length);
      const cats = Array.from(counts.keys()).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
      filters.replaceChildren(chip(ALL, 'All', projects.length),
        ...cats.map(c => chip(slug(c), c, counts.get(c))));
      filters.hidden = counts.size === 0;
    }

    // one row of chips; the toggle shows only when they don't all fit
    function fitFilters() {
      const open = filters.classList.contains('is-open');
      const clipped = !open && filters.scrollWidth > filters.clientWidth + 1;
      // fade only while there is more to the right
      const atEnd = filters.scrollLeft + filters.clientWidth >= filters.scrollWidth - 1;
      filters.classList.toggle('is-clipped', clipped && !atEnd);
      more.hidden = !open && !clipped;
    }

    function setOpen(open) {
      filters.classList.toggle('is-open', open);
      more.setAttribute('aria-expanded', String(open));
      moreLabel.textContent = open ? 'Show less' : 'All categories';
      fitFilters();
      revealActive();
    }

    // collapsed row: scroll the selected chip into view (sideways only, never the page)
    function revealActive() {
      const b = filters.querySelector('[aria-pressed="true"]');
      if (!b || filters.classList.contains('is-open')) return;
      const r = b.getBoundingClientRect(), f = filters.getBoundingClientRect();
      if (r.left < f.left || r.right > f.right) filters.scrollLeft += r.left - f.left - 8;
    }

    more.addEventListener('click', () => setOpen(!filters.classList.contains('is-open')));
    window.addEventListener('resize', fitFilters);
    filters.addEventListener('scroll', fitFilters, { passive: true });
    // chip widths change once the web fonts arrive
    document.fonts?.ready.then(() => { fitFilters(); revealActive(); });

    function select(key, push) {
      const known = Array.from(filters.children).some(b => b.dataset.cat === key);
      if (!known) key = ALL;
      filters.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === key)));
      revealActive();

      const shown = key === ALL ? projects : projects.filter(p => categoriesOf(p).some(c => slug(c) === key));
      listBox.scrollTop = 0;
      list.replaceChildren(...shown.map((p, i) => {
        const li = el('li', 'card-in'); li.style.setProperty('--d', `${Math.min(i, 9) * 60}ms`);
        li.append(card(p)); return li;
      }));

      // keep the filter in the URL so a filtered view can be shared
      if (push) {
        const url = new URL(location.href);
        if (key === ALL) url.searchParams.delete('category'); else url.searchParams.set('category', key);
        history.replaceState(null, '', url);
      }
    }

    fetch('/projects.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        projects = data;
        buildFilters();
        fitFilters();
        select(new URLSearchParams(location.search).get('category') || ALL, false);
      })
      .catch(() => {
        list.replaceChildren(el('li', 'text-[0.93rem] text-muted', 'Projects could not be loaded. Please refresh the page.'));
      });
  </script>
