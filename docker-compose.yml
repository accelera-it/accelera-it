services:
  landing:
    build: ./landing
    image: accelerait-landing
    container_name: accelerait-landing
    ports:
      - "8081:80"
    volumes:
      - ./landing:/usr/local/apache2/htdocs:ro
      - ./logs/landing:/usr/local/apache2/logs
    networks:
      - accelerait-net
    restart: unless-stopped
    healthcheck: &healthcheck
      test: [ "CMD-SHELL", "wget -q --spider http://localhost/ || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3

  website:
    build: ./website
    image: accelerait-website
    container_name: accelerait-website
    ports:
      - "8082:80"
    volumes:
      - ./website:/usr/local/apache2/htdocs:ro
      - ./logs/website:/usr/local/apache2/logs
    networks:
      - accelerait-net
    restart: unless-stopped
    healthcheck: *healthcheck

networks:
  accelerait-net:
    driver: bridge
